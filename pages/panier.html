<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Panier | ORIGINE CYCLE-MOTO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg fixed-top scrolled">
    <div class="container">
        <a class="navbar-brand" href="../index.html">ORIGINE <span>CYCLE-MØTO</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto me-4">
                <li class="nav-item"><a class="nav-link" href="../index.html">Accueil</a></li>
                <li class="nav-item"><a class="nav-link" href="../projects.html">Motos</a></li>
                <li class="nav-item"><a class="nav-link" href="../contact.html">Contact</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle"><i class="bi bi-moon-fill" id="themeIcon"></i></button>
            <a href="panier.html" class="btn position-relative text-white ms-2" style="background:none;border:none;" title="Panier">
                <i class="bi bi-cart3 fs-5"></i>
                <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size:0.65rem;display:none;">0</span>
            </a>
            <a href="login.html" class="btn text-white ms-1" style="background:none;border:none;" id="nav-user" title="Connexion">
                <i class="bi bi-person-circle fs-5"></i>
            </a>
        </div>
    </div>
</nav>

<!-- CONTENU -->
<section class="container py-5 mt-5">
    <h1 class="mb-4"><i class="bi bi-cart3 me-2"></i>Mon Panier</h1>

    <!-- PANIER VIDE -->
    <div id="panier-vide" class="text-center py-5 d-none">
        <i class="bi bi-cart-x" style="font-size:4rem;color:#ff3c3c;"></i>
        <h4 class="mt-3">Votre panier est vide</h4>
        <a href="../projects.html" class="btn btn-danger mt-3">
            <i class="bi bi-bicycle me-2"></i>Voir les motos
        </a>
    </div>

    <!-- TABLEAU PANIER -->
    <div id="panier-contenu">
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Moto</th>
                        <th>Marque</th>
                        <th>Prix unitaire</th>
                        <th style="width:130px">Quantité</th>
                        <th>Sous-total</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="panier-tbody"></tbody>
            </table>
        </div>

        <!-- RÉCAP + ACTIONS -->
        <div class="row justify-content-end mt-3">
            <div class="col-md-4">
                <div class="card p-3">
                    <div class="d-flex justify-content-between fs-5 fw-bold">
                        <span>Total</span>
                        <span id="panier-total" class="text-danger"></span>
                    </div>
                    <hr>
                    <a href="commande.html" class="btn btn-danger w-100 mb-2" id="btn-commander">
                        <i class="bi bi-credit-card me-2"></i>Passer la commande
                    </a>
                    <button class="btn btn-outline-secondary w-100" onclick="confirmerViderPanier()">
                        <i class="bi bi-trash me-2"></i>Vider le panier
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/config.js"></script>
<script src="../js/panier.js"></script>
<script src="../js/auth.js"></script>
<script>
    function formatPrixLocal(n) {
        return new Intl.NumberFormat('fr-FR').format(n) + ' HTG';
    }

    function renderPanier() {
        const panier = getPanier();
        const tbody  = document.getElementById('panier-tbody');
        const vide   = document.getElementById('panier-vide');
        const contenu = document.getElementById('panier-contenu');

        if (!panier.length) {
            vide.classList.remove('d-none');
            contenu.classList.add('d-none');
            return;
        }

        vide.classList.add('d-none');
        contenu.classList.remove('d-none');

        tbody.innerHTML = panier.map((item, i) => {
            const pu    = parsePrix(item.prix);
            const sous  = pu * item.quantite;
            return `
            <tr>
                <td>
                    <div class="d-flex align-items-center gap-3">
                        <img src="../${item.img}" alt="${item.nom}" style="width:70px;height:50px;object-fit:cover;border-radius:8px;">
                        <span class="fw-semibold">${item.nom}</span>
                    </div>
                </td>
                <td>${item.marque}</td>
                <td>${item.prix}</td>
                <td>
                    <div class="input-group input-group-sm">
                        <button class="btn btn-outline-secondary" onclick="changerQte(${i}, ${item.quantite - 1})">−</button>
                        <input type="number" class="form-control text-center" value="${item.quantite}" min="1"
                               onchange="changerQte(${i}, this.value)" style="max-width:55px;">
                        <button class="btn btn-outline-secondary" onclick="changerQte(${i}, ${item.quantite + 1})">+</button>
                    </div>
                </td>
                <td class="fw-bold text-danger">${formatPrixLocal(sous)}</td>
                <td>
                    <button class="btn btn-sm btn-outline-danger" onclick="supprimerItem(${i})" title="Supprimer">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>`;
        }).join('');

        document.getElementById('panier-total').textContent = formatPrixLocal(calculerTotal());
    }

    function changerQte(index, val) {
        mettreAJourQuantite(index, val);
        renderPanier();
    }

    function supprimerItem(index) {
        supprimerDuPanier(index);
        renderPanier();
    }

    function confirmerViderPanier() {
        if (confirm('Vider le panier ? Cette action est irréversible.')) {
            viderPanier();
            renderPanier();
        }
    }

    // Thème
    const themeToggle = document.getElementById('themeToggle');
    const themeIcon   = document.getElementById('themeIcon');
    const html        = document.documentElement;
    const savedTheme  = localStorage.getItem('theme');
    if (savedTheme) { html.setAttribute('data-bs-theme', savedTheme); themeIcon.className = savedTheme === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill'; }
    themeToggle.addEventListener('click', () => {
        const t = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-bs-theme', t);
        localStorage.setItem('theme', t);
        themeIcon.className = t === 'dark' ? 'bi bi-moon-fill' : 'bi bi-sun-fill';
    });

    document.addEventListener('DOMContentLoaded', renderPanier);
</script>
</body>
</html>
